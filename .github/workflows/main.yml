name: Deploy to Linux Server

on:
  push:
    branches:
      - Personal  # or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Pull latest changes and restart service
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          nvm use node  # or specific version like `nvm use 18`
          
          cd /home/ubuntu/ahmed_frontend
          git pull
          npm i
          npm run build
          sudo rm -r /var/www/ncec-frontend/
          sudo mv dist/ /var/www/ncec-frontend/
        EOF
